[project]
name = "jira_ai_assistant"
version = "0.1.0"
description = "jira_ai_assistant using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.5.0",
    "pydantic>=2.10.6",
]

[project.scripts]
jira_ai_assistant = "jira_ai_assistant.main:run"
run_crew = "jira_ai_assistant.main:run"
train = "jira_ai_assistant.main:train"
replay = "jira_ai_assistant.main:replay"
test = "jira_ai_assistant.main:test"
run_with_trigger = "jira_ai_assistant.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
