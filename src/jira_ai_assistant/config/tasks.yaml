plan_epic_backlog:
  description: >
    Analyze the Jira epic {epic_key} in project {project_key} together
    with project configuration, explicit timelines, existing issues,
    team CVs, and Jira history. Produce a complete, structured backlog
    plan for this epic:
      - Clear problem and outcome statement for the epic.
      - Breakdown into Stories, Tasks, Bugs, and Sub-tasks.
      - Dependencies between items and suggested ordering.
      - Effort / complexity hints (e.g., approximate story points).
      - Draft ownership suggestions per item (by assignee id using jira_get_all_users tool).
      - High-level schedule aligned to the epic’s start/end dates or
        sprint cadence, calling out risks if capacity is insufficient.
    Use the tools to:
      - Read epic and project issues (jira_get_all_epics,
        jira_get_issue_details, jira_get_all_issues_with_details).
      - Read team CVs from the resumes directory or a provided path
        (pdf_file_retriever) and infer skills, seniority, and roles.
      - Read Jira history per user id to refine skill and throughput
        estimates (jira_get_user_history).
      - Inspect the sprint structure and current load for the project
        using jira_get_all_sprints and jira_get_sprint_issues so you
        can reason about which sprints are the best fit for the planned
        work, without modifying Jira yet.
    Focus on the *plan* only in this task: do not create or update Jira
    issues yet. The output will be consumed by the execution task.
  expected_output: >
    A well-structured JSON object with the following top-level keys:
      - "epic_summary": short plain-text summary of the epic.
      - "assumptions": list of assumptions about scope, timelines, and
        capacity.
      - "risks": list of textual risk items (id, description, impact,
        mitigation).
      - "backlog_items": array of objects, each with:
          - "title": concise, action-oriented issue title.
          - "type": one of ["Story", "Task", "Bug", "Sub-task"].
          - "parent_hint": epic_key or parent issue key/name if it
            should be a Sub-task.
          - "description": comprehensive plain-text description including:
              * Problem statement and context
              * Detailed acceptance criteria (given/when/then format preferred)
              * Definition of Done with specific deliverables
              * implementation notes to be considered by the developer
              * Testing requirements and edge cases to consider
              * Any API endpoints, database changes, or integration points
          - "labels": optional list of suggested labels.
          - "components": optional list of suggested components.
          - "story_points_hint": integer or null.
          - "assignee": str of the best candidate assignee accountId that fits for this issue using jira_get_all_users tool (Do not use names).
          - "dependency_hints": optional list of titles/keys that
            should precede this item.
          - "schedule_hint": suggested start/due date ranges relative
            to the epic timeline (plain text).
          - "sub_tasks_hint": for Stories, include list of suggested Sub-task titles covering development, testing, documentation, and deployment.
          - "sprint_hint": suggested sprint name or identifier that this item should eventually be assigned to (do not leave empty for in-scope work).
      - "schedule_overview": plain-text explanation of how work should
        be sequenced over the epic timeline or sprints.
    This JSON must be valid, with no trailing commas, and ready to be
    parsed programmatically.
  agent: product_manager
  output_file: output/plan_epic_backlog.md

execute_epic_backlog:
  description: >
    Take the structured backlog plan (JSON) produced by plan_epic_backlog
    for epic {epic_key} in project {project_key} and turn it into actual
    Jira issues with realistic assignments, dates, and sprint placement.
    For each planned
    backlog item:
      - Create Jira issues (Story, Task, Bug, Sub-task) under the correct epic or parent.
      - Write comprehensive descriptions including:
          * Clear problem statement and context
          * Detailed acceptance criteria in given/when/then format
          * Definition of Done with specific, measurable deliverables
          * Technical approach and implementation notes
          * Testing requirements and edge cases
          * Integration points and dependencies
      - For each Story, create Sub-tasks covering:
          * Development work (frontend, backend, API, database, etc.)
          * Testing (unit tests, integration tests, E2E tests, manual QA)
          * Documentation (code comments, README updates, API specs, user guides)
          * Code review and deployment preparation
      - Decide a single assignee based on CV skills, Jira history, and
        current workload. Avoid over-assigning any individual
        beyond reasonable capacity for the timeframe.
      - Set start_date and due_date in Jira within the epic timeline
        assuming each sprint is 2 weeks.
      - Decide and apply sprint allocation by:
          * Using jira_get_all_sprints to discover active and future sprints
          * Using jira_get_sprint_issues to understand current load per sprint
            and per assignee
          * Creating new sprints with jira_create_sprint when there is no
            suitable existing sprint for the planned work
          * Moving newly created or existing issues into the chosen sprint
            using jira_move_issue_to_sprint so workload is balanced across
            people and timeframes.
      - You MUST ensure that every Story, Task, Bug, and Sub-task created
        for this epic is assigned to a specific sprint (existing or newly
        created). Do not leave any epic-related issue in the generic backlog
        without a sprint.
      - Optionally set story points and labels/components if supported.
    If you detect that the plan is infeasible (e.g., capacity too low
    for the timeline), still create the issues but:
      - Prefer to schedule critical path work earlier.
      - Add comments to the epic or key issues explaining the risk and
        proposing mitigations (e.g., scope cut, more people, longer
        timeline).
  expected_output: >
    A JSON object capturing what was actually done in Jira:
      - "epic_key": the epic key.
      - "created_issues": array of objects:
          - "issue_key": Jira issue key.
          - "issue_type": type ("Story", "Task", "Bug", "Sub-task").
          - "summary": final issue summary.
          - "description_summary": brief summary of what was included in the description (e.g., "Acceptance criteria with 3 scenarios, DoD with 5 deliverables, testing requirements").
          - "assignee": accountId (not display name).
          - "start_date": YYYY-MM-DD or null.
          - "due_date": YYYY-MM-DD or null.
          - "story_points": integer or null.
          - "parent_key": parent issue key for sub-tasks, else null.
          - "sub_tasks_created": for Stories, list of Sub-task keys created under this Story.
          - "sprint_id": numeric sprint identifier that the issue was moved into.
          - "sprint_name": human-readable sprint name.
      - "updated_issues": array of objects similar to "created_issues"
        for any issues you updated (dates, assignee, story points,
        labels, or status).
      - "comments_added": array of objects:
          - "issue_key": where the comment was added.
          - "comment_summary": short description of the comment
            content (not full text).
      - "capacity_notes": plain-text explanation of how capacity and
        availability were considered and any remaining risks.
    This JSON must reflect the actual tool results (issue keys, etc.)
    and be valid JSON without trailing commas.
  agent: product_manager
  output_file: output/execute_epic_backlog.md

follow_up_sprint_tasks:
  description: >
    Review all active sprint tasks in project {project_key} and write
    gentle, professional follow-up comments to developers. For each task,
    analyze its current status, due date, assignee, and existing comments
    to craft a personalized follow-up that:
      - Reminds about the due date (days remaining or overdue)
      - Requests a brief status update
      - Asks specific questions based on task state and context
      - Offers support and asks about blockers
      - Maintains a supportive, non-accusatory tone
    
    Workflow:
      1. Use jira_get_all_sprints to discover all active sprints in
         project {project_key}. Filter for sprints with state="active".
      2. For each active sprint, use jira_get_sprint_issues to get all
         issues currently in that sprint.
      3. For each issue, use jira_get_issue_details to get comprehensive
         information including status, assignee, due date, comments, and
         last update time.
      4. Analyze each task:
         - Calculate days until due date (or days overdue)
         - Assess urgency based on time remaining and current status
         - Review existing comments to understand context
         - Identify specific concerns (overdue, stale, blocked, etc.)
      5. CRITICAL: You MUST use the jira_add_comment tool to actually write
         a follow-up comment for EACH active sprint task. Do not just plan or
         describe what comment to write - you must CALL the tool with:
         - issue_key: the Jira issue key (e.g., "MH-205")
         - body: the full comment text to add
         Personalize each comment based on:
         - Task status (To Do, In Progress, In Review, etc.)
         - Start date
         - Due date proximity (overdue, due soon, on schedule)
         - Recent activity (last update, recent comments)
         - Complexity indicators (story points, subtasks)
         
         IMPORTANT: Only set "comment_added": true in your output if the
         jira_add_comment tool call returned successfully. If the tool was
         not called or failed, set "comment_added": false and explain why.
      
    Comment Guidelines:
      - Start with a friendly greeting
      - Reference the specific due date and time remaining
      - Ask targeted questions based on task state:
        * "To Do" tasks: Has work started? Any blockers?
        * "In Progress" tasks: On track for completion? Any challenges?
        * Overdue tasks: What's preventing completion? Need assistance?
        * Stale tasks: Still relevant? Need clarification?
      - Offer concrete support
      - Keep tone supportive and collaborative, not demanding
      - Be concise—respect developer time
  expected_output: >
    A JSON object summarizing the follow-up actions:
      - "project_key": the project key reviewed.
      - "sprints_reviewed": array of objects with:
          - "sprint_id": the sprint ID.
          - "sprint_name": the sprint name.
          - "sprint_state": the sprint state (should be "active").
          - "task_count": number of tasks in this sprint.
      - "tasks_followed_up": array of objects with:
          - "issue_key": the Jira issue key.
          - "summary": the issue summary/title.
          - "status": current issue status.
          - "assignee": assignee display name or account ID.
          - "due_date": due date in YYYY-MM-DD format or null.
          - "days_until_due": integer (negative if overdue, null if no due date).
          - "comment_added": boolean - MUST be true ONLY if jira_add_comment
            tool was actually called and returned successfully. Set to false
            if tool was not called or failed.
          - "comment_summary": brief summary of the actual comment that was
            added via the jira_add_comment tool (null if no comment added).
      - "summary": plain-text overall summary of follow-up actions,
        including total tasks reviewed, comments added, and any critical
        concerns observed (e.g., multiple overdue tasks, blocked work).
    This JSON must be valid with no trailing commas.
  agent: follow_up_agent
  output_file: output/follow_up_sprint_tasks.md
